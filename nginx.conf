server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml audio/mpeg audio/wav;

    # Filenames with spaces (e.g. "Kiryat shmona.png")
    ignore_invalid_headers off;

    error_page 404 /404.html;
    error_page 403 /404.html?type=403;
    error_page 500 502 503 504 /404.html?type=500;

    # Match firebase.json: no-cache for HTML entry points
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache";
    }

    # Match firebase.json: long-lived cache for hashed/static assets
    location ~* \.(?:js|css|jpg|jpeg|png|gif|svg|woff|woff2|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Local docker-compose only: proxy /api to the backend container.
    # On GCP the Load Balancer routes /api/* to Cloud Run (thepinkfront-api),
    # so this block is never hit in production.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Match firebase.json rewrite: /admin/** → SPA
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
