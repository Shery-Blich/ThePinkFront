<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שגיאה - החזית הוורודה</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Rubik:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #12121c;
      font-family: 'Rubik', 'Outfit', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* CRT Scanlines Overlay */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .retro-terminal-window {
      background: rgba(18, 18, 28, 0.95);
      border: 4px solid #ff007f;
      box-shadow: 6px 6px 0px #000000;
      width: 90%;
      max-width: 520px;
      padding: 2rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .retro-terminal-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #00e6ff, #ff007f);
    }

    .error-title {
      font-family: 'Outfit', 'Rubik', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 900;
      color: #ff007f;
      text-shadow: 2px 2px 0px #000000;
      line-height: 1.2;
    }

    .ascii-art {
      font-family: monospace;
      white-space: pre;
      font-size: 10px;
      color: #f48fb1;
      line-height: 1.2;
      margin: 0.5rem 0;
      animation: bounce 1.2s infinite alternate ease-in-out;
    }

    .error-desc {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: #a0a0b0;
      line-height: 1.5;
    }

    .terminal-box {
      width: 100%;
      background: #1e1e2f;
      border: 2px dashed #00e6ff;
      border-radius: 6px;
      padding: 1rem;
      font-family: monospace;
      text-align: right;
      font-size: 0.85rem;
      color: #00e6ff;
      overflow-x: auto;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #ff007f;
      color: #ffffff;
      font-family: 'Rubik', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      padding: 0.75rem 1.5rem;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.15s steps(4, end);
      text-shadow: 1px 1px 0px #000;
      text-decoration: none;
      width: 100%;
      max-width: 240px;
      border-radius: 4px;
    }

    .cta-button:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
      background: #e60072;
    }

    .cta-button:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    .cta-button:focus {
      outline: 3px solid #00e6ff;
      outline-offset: 4px;
    }

    @keyframes bounce {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-8px);
      }
    }
  </style>
</head>
<body>

  <!-- CRT Overlay -->
  <div class="crt-overlay"></div>

  <div class="retro-terminal-window">
    <div class="error-title" id="error-title">404 - הדרך נחסמה! 🛑</div>
    
    <div class="ascii-art">
 /\_/\  
( o.o ) 
 > ^ <  
    </div>

    <div class="error-desc" id="error-desc">
      העמוד שחיפשת לא נמצא ברשימות הוועדה. אולי פנית שמאלה במקום ימינה בדרך לקלפי?
    </div>

    <div class="terminal-box" id="terminal-details">
      STATUS: 404 NOT FOUND<br>
      LOCATION: unknown_route<br>
      MESSAGE: Route verification failed.
    </div>

    <a href="/" class="cta-button">
      <span>חזרה לדף הבית</span>
    </a>
  </div>

  <script>
    // Read query parameters
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');

    const titleEl = document.getElementById('error-title');
    const descEl = document.getElementById('error-desc');
    const terminalEl = document.getElementById('terminal-details');

    if (type === '403') {
      titleEl.textContent = 'אין לך אישור מעבר! 🚫';
      descEl.textContent = 'אין לך אישור מעבר לוועדה זו! משהו אומר לנו שהמסמכים שלך לא הוגשו בזמן.';
      terminalEl.innerHTML = 'STATUS: 403 FORBIDDEN<br>ACCESS: DENIED<br>MESSAGE: Unauthorized checkpoint entry attempt.';
    } else if (type === '500') {
      titleEl.textContent = 'קריסת מערכות בקלפי! ⚠️';
      descEl.textContent = 'קרתה שגיאה בשרתים של הוועדה. שלומי מעד על כבלי הרשת... אל דאגה, צוות התחזוקה כבר מטפל במחדל!';
      terminalEl.innerHTML = 'STATUS: 500 INTERNAL SERVER ERROR<br>CAUSE: server_ballot_box_crash<br>MESSAGE: Database connection lost or script error.';
    }
  </script>
</body>
</html>
