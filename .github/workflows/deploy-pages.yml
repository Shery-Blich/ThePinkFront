name: Deploy game to GitHub Pages

# Builds and publishes the Phaser game (root Vite project) to GitHub Pages.
# Admin/analytics (frontend/) is not part of this workflow yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The prebuild step (scripts/sync-questions.mjs) uses the backend's MongoDB driver
      - name: Install backend dependencies
        run: npm --prefix backend ci --omit=dev

      # Prebuild copies the current questions from MongoDB into the game's fallback set.
      # If the secret is missing or Mongo is unreachable, the committed copy is used.
      - name: Build game
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI_READONLY }}

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
